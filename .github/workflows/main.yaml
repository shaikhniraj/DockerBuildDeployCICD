name: CI/CD Pipeline - Checkout, Test, Build, Push to ECR, Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: default/shaikhniraj
  DOCKER_IMAGE_TAG: ${{ github.sha }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  GIT_BRANCH: ${{ github.ref_name }}
  MONGO_URI: ${{ secrets.MONGO_URI }}

jobs:
  checkout-and-test:
    name: Checkout and Test
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ env.GIT_COMMIT_SHA }}
      branch: ${{ env.GIT_BRANCH }}
      image-tag: ${{ env.DOCKER_IMAGE_TAG }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        id: test
        run: |
          pytest test_app.py -v --tb=short
        continue-on-error: false

      - name: Test Summary
        if: always()
        run: |
          echo "✅ All tests passed successfully!"

  build-and-push:
    name: Build Docker Image and Push to ECR
    needs: checkout-and-test
    runs-on: ubuntu-latest
    if: success()
    outputs:
      image_uri: ${{ steps.image_info.outputs.image_uri }}
      ecr_registry: ${{ steps.image_info.outputs.registry }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set ECR image details
        id: image_info
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}:${DOCKER_IMAGE_TAG}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "Using image URI: ${image_uri}"

      - name: Build Docker image
        id: docker-build
        env:
          ECR_REGISTRY: ${{ steps.image_info.outputs.registry }}
        run: |
          echo "Building Docker image with tag: ${{ env.DOCKER_IMAGE_TAG }}"
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} .
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "Build completed successfully"

      - name: Push image to Amazon ECR
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.image_info.outputs.registry }}
        run: |
          echo "Pushing image to ECR..."
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "Image pushed successfully"

      - name: Set image URI output
        id: image
        env:
          ECR_REGISTRY: ${{ steps.image_info.outputs.registry }}
        run: |
          echo "Image URI: ${{ steps.image_info.outputs.image_uri }}"

  deploy-to-ec2:
    name: Deploy to EC2 Instance
    needs: [checkout-and-test, build-and-push]
    runs-on: ubuntu-latest
    if: success()
    outputs:
      deployment-status: ${{ steps.deploy.outputs.status }}
      health-check: ${{ steps.health-check.outputs.result }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via AWS Systems Manager
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          set -euo pipefail

          echo "Starting deployment to EC2 instance ${INSTANCE_ID} via SSM..."

          commands=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg image "$IMAGE_URI" \
            --arg mongo_uri "$MONGO_URI" \
            --arg secret_key "$SECRET_KEY" \
            '{commands: [
              "set -e",
              "echo Starting deployment on $(hostname)",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("docker pull " + $image),
              "docker stop student-app 2>/dev/null || true",
              "docker rm student-app 2>/dev/null || true",
              "docker system prune -f",
              ("docker run -d --name student-app -p 80:5000 -e MONGO_URI=" + ($mongo_uri | @sh) + " -e SECRET_KEY=" + ($secret_key | @sh) + " --restart unless-stopped --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 " + $image),
              "sleep 5",
              "docker ps | grep -q student-app || { docker logs student-app || true; exit 1; }",
              "echo Container is running"
            ]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_URI}" \
            --parameters "$commands" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command submitted: ${command_id}"
          for attempt in {1..60}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)
            case "$status" in
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done

          invocation=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID")
          echo "$invocation" | jq -r '.StandardOutputContent'
          echo "$invocation" | jq -r '.StandardErrorContent' >&2

          status=$(echo "$invocation" | jq -r '.Status')
          if [ "$status" != "Success" ]; then
            echo "SSM deployment failed with status: ${status}"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Health Check - Verify Application
        id: health-check
        run: |
          echo "Performing health check on deployed application..."
          
          # Get EC2 instance details
          EC2_HOST="${{ secrets.EC2_HOST }}"
          HEALTH_CHECK_URL="http://${EC2_HOST}/health"
          
          # Retry logic for health check
          MAX_RETRIES=5
          RETRY_INTERVAL=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            if curl -s -f -m 5 "$HEALTH_CHECK_URL" > /dev/null 2>&1; then
              echo "✅ Application health check PASSED"
              echo "result=success" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Health check failed. Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done
          
          echo "❌ Application health check FAILED after $MAX_RETRIES attempts"
          echo "result=failed" >> $GITHUB_OUTPUT
          exit 1

  notify-success:
    name: Notify - Deployment Success
    needs: [checkout-and-test, build-and-push, deploy-to-ec2]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Send Success Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ DEPLOYMENT SUCCESSFUL - Student Registration System"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_FROM_EMAIL }}
          body: |
            ========================================
            ✅ DEPLOYMENT SUCCESSFUL
            ========================================
            
            Deployment Status: SUCCESS
            
            Git Details:
            - Commit SHA: ${{ needs.checkout-and-test.outputs.commit-sha }}
            - Branch: ${{ needs.checkout-and-test.outputs.branch }}
            - Repository: ${{ github.repository }}
            
            Docker Image:
            - Image Tag: ${{ needs.checkout-and-test.outputs.image-tag }}
            - Image URI: ${{ needs.build-and-push.outputs.image_uri }}
            - Registry: ${{ needs.build-and-push.outputs.ecr_registry }}
            
            Deployment Target:
            - EC2 Instance: ${{ secrets.EC2_HOST }}
            - Container Name: student-app
            - Port Mapping: 80:5000
            
            Pipeline Stages Completed:
            ✅ Checkout - Source code pulled
            ✅ Dependencies - pip install completed
            ✅ Tests - All pytest tests passed
            ✅ Build - Docker image built successfully
            ✅ Push - Image pushed to ECR
            ✅ Deploy - Container running on EC2
            ✅ Health Check - Application verified as healthy
            
            Pipeline Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Triggered by: ${{ github.triggering_actor }}
            Timestamp: ${{ github.event.head_commit.timestamp }}
            
            ========================================
            Application is now live and ready to use.
            ========================================

  notify-failure:
    name: Notify - Deployment Failure
    needs: [checkout-and-test, build-and-push, deploy-to-ec2]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Determine Failure Stage
        id: failure-stage
        run: |
          if [ "${{ needs.checkout-and-test.result }}" = "failure" ]; then
            echo "stage=Testing (pytest)" >> $GITHUB_OUTPUT
            echo "stage_details=One or more tests failed. Check logs for details." >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-and-push.result }}" = "failure" ]; then
            echo "stage=Build & Push to ECR" >> $GITHUB_OUTPUT
            echo "stage_details=Docker image build or ECR push failed." >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy-to-ec2.result }}" = "failure" ]; then
            echo "stage=Deployment to EC2" >> $GITHUB_OUTPUT
            echo "stage_details=Container failed to start or health check failed." >> $GITHUB_OUTPUT
          else
            echo "stage=Unknown" >> $GITHUB_OUTPUT
            echo "stage_details=Unknown failure. Check pipeline logs." >> $GITHUB_OUTPUT
          fi

      - name: Send Failure Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ DEPLOYMENT FAILED - Student Registration System"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_FROM_EMAIL }}
          body: |
            ========================================
            ❌ DEPLOYMENT FAILED
            ========================================
            
            Deployment Status: FAILED
            Failed Stage: ${{ steps.failure-stage.outputs.stage }}
            
            Stage Details:
            ${{ steps.failure-stage.outputs.stage_details }}
            
            Git Details:
            - Commit SHA: ${{ needs.checkout-and-test.outputs.commit-sha }}
            - Branch: ${{ needs.checkout-and-test.outputs.branch }}
            - Repository: ${{ github.repository }}
            
            Pipeline Stages Status:
            ${{ needs.checkout-and-test.result == 'failure' && '❌' || '✅' }} Checkout
            ${{ needs.checkout-and-test.result == 'failure' && '❌' || '✅' }} Dependencies & Tests
            ${{ needs.build-and-push.result == 'failure' && '❌' || (needs.checkout-and-test.result == 'failure' && '⏭️' || '✅') }} Build & Push to ECR
            ${{ needs.deploy-to-ec2.result == 'failure' && '❌' || (needs.build-and-push.result == 'failure' && '⏭️' || '✅') }} Deploy to EC2
            
            Immediate Action Required:
            1. Review the pipeline logs for detailed error messages
            2. Check the failed stage's output above
            3. Fix the issue and push a new commit
            
            Pipeline Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Triggered by: ${{ github.triggering_actor }}
            Timestamp: ${{ github.event.head_commit.timestamp }}
            
            ========================================
            Please investigate and resolve the issue.
            ========================================
